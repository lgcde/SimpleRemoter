name: MSBuild

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  SOLUTION_FILE_PATH: ./2019Remote.sln
  BUILD_CONFIGURATION: Release
  # 彻底解决中文编码警告：强迫微软编译器使用 UTF-8
  CL: /utf-8

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. 强制在系统层安装组件，并确保进程完全退出后再往下走
    - name: Install Visual Studio MFC and ATL components
      shell: powershell
      run: |
        $vsInstaller = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vs_installer.exe"
        $vsPath = & (Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer\vswhere.exe") -latest -property installationPath
        
        Write-Host "正在检测环境..."
        Write-Host "VS 路径: $vsPath"
        
        if (Test-Path $vsInstaller) {
            Write-Host "开始安装 MFC 和 ATL 组件，请稍候..."
            # 使用 Start-Process 的 -Wait 参数，且保证参数格式严丝合缝
            $process = Start-Process $vsInstaller -ArgumentList "modify --installPath `"$vsPath`" --add Microsoft.VisualStudio.Component.VC.ATLMFC --passive --norestart" -Wait -PassThru
            
            if ($process.ExitCode -eq 0 -or $process.ExitCode -eq 3010) {
                Write-Host "C++ MFC/ATL 组件安装成功！"
            } else {
                Write-Warning "安装程序返回了非零状态码: $($process.ExitCode)，可能需要注意。"
            }
        } else {
            Write-Error "找不到 VS Installer，请检查 Runner 环境！"
            exit 1
        }

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    # 2. 移除之前命令行里可能不兼容的特殊参数，保持纯净编译
    - name: Build solution
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SimpleRemoter-Build
        path: |
          **/Release/*.exe
          **/Release/*.dll

name: MSBuild

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  SOLUTION_FILE_PATH: ./2019Remote.sln
  BUILD_CONFIGURATION: Release
  # 彻底解决中文编码警告：强迫微软编译器使用 UTF-8
  CL: /utf-8

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 1. 安全且无语法错误的组件安装方式
    - name: Install Visual Studio MFC and ATL components
      shell: cmd
      run: |
        "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe" modify --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" --add Microsoft.VisualStudio.Component.VC.ATLMFC --passive --norestart

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build solution
      run: |
        msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SimpleRemoter-Build
        path: |
          **/Release/*.exe
          **/Release/*.dll
